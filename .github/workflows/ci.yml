# CI: pytest matrix, ruff lint + format check, ty type check.
# The test suite stubs `homeassistant` entirely (tests/conftest.py), so the
# test job needs no HA install; the type-check job installs real HA + the
# pinned cremalink-lodzen so ty resolves real types.
name: CI
permissions:
  contents: read
  pull-requests: write

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      # The cremalink-lodzen pin lives in pyproject.toml only — read it back
      # instead of duplicating the version here.
      run: |
        python -m pip install --upgrade pip
        SPEC=$(python -c 'import tomllib; print(next(d for d in tomllib.load(open("pyproject.toml","rb"))["project"]["dependencies"] if "cremalink-lodzen" in d))')
        python -m pip install -r requirements_test.txt "$SPEC"
    - name: Test with pytest
      run: pytest
      env:
        PYTHONPATH: .

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.14"
    - name: Install dependencies and tools
      # Install the full project dependency set from pyproject.toml so ty
      # resolves real homeassistant/cremalink types.
      run: |
        python -m venv .venv
        DEPS=$(python -c 'import tomllib; print(" ".join(tomllib.load(open("pyproject.toml","rb"))["project"]["dependencies"]))')
        .venv/bin/pip install -r requirements_test.txt $DEPS ruff==0.14.5 ty==0.0.101
    - name: Ruff lint
      run: .venv/bin/ruff check .
    - name: Ruff format check
      run: .venv/bin/ruff format --check .
    - name: Type check with ty
      run: .venv/bin/ty check .
      env:
        PYTHONPATH: .
