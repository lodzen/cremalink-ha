[project]
name = "cremalink-ha"
version = "v0.3.0b1"
description = "Cremalink for Home-Assistant Add-on & Integration"
requires-python = ">=3.13.2"
dependencies = [
    "homeassistant>=2026.2.3",
    "cremalink-lodzen==2.0.0.dev5"
]

[dependency-groups]
docs = [
    "sphinx==9.1.0",
    "sphinxcontrib-websupport==2.0.0",
    "sphinx-rtd-theme==3.1.0"
]

[tool.ty.src]
# tests/ uses duck-typed fakes (SimpleNamespace devices, FakeMonitorData)
# that intentionally violate the real protocols — not worth annotating.
# docs/source/conf.py is a Sphinx build script that mocks HA imports.
exclude = ["tests", "docs"]

[tool.ty.rules]
# HA entities override writable cached_property attributes (is_on,
# native_value, options, current_option, extra_state_attributes...) with
# read-only @property declarations — the universal entity idiom that ty's
# override check flags as a false positive.
incompatible-property-override = "ignore"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Load the HA harness before setuptools plugins so its httpx2 alias
# installs before respx's plugin module imports httpx.
addopts = "-p pytest_homeassistant"
asyncio_mode = "auto"
# pytest-homeassistant resolves fixture/config dirs from these.
ha_test_root = "tests"

[tool.coverage.run]
source = ["custom_components/cremalink_ha"]
